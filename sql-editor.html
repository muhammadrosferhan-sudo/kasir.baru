<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SQL Editor – Supabase</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <header class="header">
    <h1 data-i18n="sql_editor.title">SQL Editor</h1>
    <button id="logoutBtn" data-action="logout">Keluar</button>
  </header>
  <main class="container">
    <section class="panel">
      <h2 data-i18n="sql_editor.instructions">Masukkan perintah SQL (hanya untuk pemilik)</h2>
      <textarea id="sqlInput" rows="10" placeholder="SELECT * FROM products;" style="width:100%;"></textarea>
      <div class="acts" style="margin-top:8px;">
        <button class="primary" id="runBtn" data-action="runSql">Jalankan</button>
      </div>
    </section>
    <section class="panel" style="margin-top:16px;">
      <h3 data-i18n="sql_editor.result">Hasil</h3>
      <pre id="result" style="background:#f8f8f8;padding:8px;overflow:auto;max-height:300px;">-</pre>
    </section>
  </main>

  <script type="module" src="../js/sql-editor.js"></script>
</body>
</html>
